<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3929B5">
  <meta name="description" content="Descubre snacks, bebidas y productos asiáticos en K-TARO.">
  <title>K-TARO | Tienda de productos asiáticos</title>
  <link rel="stylesheet" th:href="@{/css/inicio.css}">
</head>
<body>
  <div th:replace="~{fragments/header :: siteHeader}"></div>

  <main>
    <section class="hero" aria-labelledby="heroTitle">
      <div class="hero-content">
        <h1 id="heroTitle">¡Vive la real experiencia coreana!</h1>
        <a class="button button-primary hero-button" href="#productos">COMPRAR AHORA</a>
      </div>
    </section>

    <section class="product-section featured-section" id="productos" aria-labelledby="featuredTitle">
      <div class="section-heading">
        <h2 id="featuredTitle">Productos</h2>
        <a class="see-more" th:href="@{/productos/snacks}" aria-label="Ver más productos">Ver más <span aria-hidden="true">⟶</span></a>
      </div>
      <div class="product-grid">
        <article class="product-card" th:each="product : ${featuredProducts}">
          <div class="product-image">
            <a class="product-detail-link" th:href="@{/productos/detalle/{id}(id=${product.id()})}"
              th:aria-label="|Ver detalle de ${product.name()}|">
              <img th:if="${product.image() != null}" th:src="${product.image()}" th:alt="${product.name()}" loading="lazy">
              <div class="image-placeholder" th:if="${product.image() == null}" role="img" th:aria-label="|Imagen pendiente: ${product.name()}|">
                <span class="placeholder-icon" aria-hidden="true">✳</span><span>Imagen pendiente</span>
              </div>
            </a>
          </div>
          <div class="product-info">
            <h3><a class="product-detail-link" th:href="@{/productos/detalle/{id}(id=${product.id()})}"
              th:text="${product.name()}">Producto</a></h3>
            <p class="product-price">S/ <span th:text="${product.price().toPlainString()}">0.00</span></p>
            <button class="button button-cart add-to-cart" type="button"
              th:attr="data-product-id=${product.id()},data-product-name=${product.name()},data-product-price=${product.price()}">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.1 11.1a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg>
              Agregar al carrito
            </button>
          </div>
        </article>
      </div>
    </section>

    <section class="promo-section" id="promociones" aria-labelledby="promoTitle">
      <div class="promo-inner">
        <div class="section-heading">
          <h2 id="promoTitle">Promociones</h2>
          <a class="see-more" th:href="@{/promociones}" aria-label="Ver más promociones">Ver más <span aria-hidden="true">⟶</span></a>
        </div>
        <div class="product-grid">
          <article class="product-card promo-card" th:each="product : ${promotionalProducts}">
            <span class="discount-badge" th:text="${product.discountPercent()} + '% OFF'">30% OFF</span>
            <div class="product-image">
              <a class="product-detail-link" th:href="@{/productos/detalle/{id}(id=${product.id()})}"
                th:aria-label="|Ver detalle de ${product.name()}|">
                <img th:if="${product.image() != null}" th:src="${product.image()}" th:alt="${product.name()}" loading="lazy">
                <div class="image-placeholder" th:if="${product.image() == null}" role="img" th:aria-label="|Imagen pendiente: ${product.name()}|">
                  <span class="placeholder-icon" aria-hidden="true">✳</span><span>Imagen pendiente</span>
                </div>
              </a>
            </div>
            <div class="product-info">
              <h3><a class="product-detail-link" th:href="@{/productos/detalle/{id}(id=${product.id()})}"
                th:text="${product.name()}">Producto en promoción</a></h3>
              <p class="price-line">
                <del>S/ <span th:text="${product.originalPrice().toPlainString()}">0.00</span></del>
                <strong>S/ <span th:text="${product.price().toPlainString()}">0.00</span></strong>
              </p>
              <button class="button button-cart add-to-cart" type="button"
                th:attr="data-product-id=${product.id()},data-product-name=${product.name()},data-product-price=${product.price()}">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.1 11.1a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg>
                Agregar al carrito
              </button>
            </div>
          </article>
        </div>
      </div>
    </section>
  </main>

  <div th:replace="~{fragments/footer :: siteFooter}"></div>
  <script th:src="@{/js/ts/inicio.js}" defer></script>
</body>
</html>
