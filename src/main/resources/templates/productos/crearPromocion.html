<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{/css/inicio.css}">

  <title>Crear promoción | K-TARO</title>
</head>
<body>

<header>
  <div th:replace="~{fragments/admin-header :: adminHeader}"></div>
</header>

<main>
  <div class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="container">
      <p class="mb-0 fw-bold fs-3" style=" color: #3929b5;">CREAR NUEVA PROMOCIÓN</p>
      <p class="fs-5" style=" color: #6351e7;">Registra una nueva promoción</p>

      <div class="alert alert-success" role="status" th:if="${mensaje}" th:text="${mensaje}"></div>

      <div class="card shadow-sm border-0">
        <div class="card-body">
          <p class="fs-5 fw-bold" style=" color: #3929b5;">
            Datos del nuevo registro
          </p>

          <form id="promotionForm" th:action="@{/admin/promociones}" th:object="${promotionForm}" method="post" novalidate>
            <div class="row g-3 ">

              <div class="col">
                <label for="name" class="form-label" style=" color: #6351e7;">Nombre de la promoción</label>
                <input type="text" id="name" th:field="*{name}" class="form-control"
                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" maxlength="100">
                <div class="invalid-feedback" th:errors="*{name}"></div>
              </div>

              <div class="col">
                <label for="duration" class="form-label d-block" style=" color: #6351e7;">Tiempo de duración</label>
                <select id="duration" th:field="*{duration}" class="form-control form-select text-secondary"
                        th:classappend="${#fields.hasErrors('duration')} ? 'is-invalid'">
                  <option value="">Selecciona...</option>
                  <option value="siempre">Siempre</option>
                  <option value="domingos">Domingos</option>
                  <option value="miercoles">Miércoles</option>
                </select>
                <div class="invalid-feedback" th:errors="*{duration}"></div>
              </div>

              <div class="col-12">
                <label for="description" class="form-label" style=" color: #6351e7;">Descripción de la promoción</label>
                <textarea id="description" th:field="*{description}" class="form-control" rows="4" maxlength="500"
                          th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
                <div class="invalid-feedback" th:errors="*{description}"></div>
              </div>

              <p class="mb-0" style="color: #6351e7;">Contenido de la promoción</p>
              <div class="col-12">
                <div class="input-group mb-2">
                  <select id="promoProductSelect" class="form-select text-secondary" aria-label="Producto a agregar">
                    <option value="">Selecciona un producto...</option>
                    <option th:each="p : ${availableProducts}"
                            th:value="${p.id()}"
                            th:text="${p.name()}"
                            th:attr="data-name=${p.name()},data-category=${p.category()},data-price=${p.price()}">Producto</option>
                  </select>
                  <button type="button" id="addPromoProduct" class="btn btn-outline-secondary">+ Agregar producto</button>
                </div>

                <table class="table">
                  <thead>
                  <tr>
                    <th scope="col" style=" color: #6351e7;">ID</th>
                    <th scope="col" style=" color: #6351e7;">Nombre del producto</th>
                    <th scope="col" style=" color: #6351e7;">Tipo</th>
                    <th scope="col"><span class="visually-hidden">Quitar</span></th>
                  </tr>
                  </thead>
                  <tbody id="promoProductRows">
                  <tr th:each="p : ${selectedProducts}" th:attr="data-product-id=${p.id()},data-price=${p.price()}">
                    <td th:text="${p.id()}">id</td>
                    <td th:text="${p.name()}">Nombre</td>
                    <td th:text="${p.category()}">Tipo</td>
                    <td>
                      <input type="hidden" name="productIds" th:value="${p.id()}">
                      <button type="button" class="btn btn-sm btn-link text-danger promo-remove">Quitar</button>
                    </td>
                  </tr>
                  </tbody>
                </table>
                <div class="text-danger small" id="promoProductsError"
                     th:if="${#fields.hasErrors('productIds')}" th:errors="*{productIds}"></div>
                <p class="text-secondary small mb-0">Precio normal de los productos: S/ <span id="promoRegularTotal">0.00</span></p>
              </div>

              <div class="col-4">
                <label for="price" class="form-label" style=" color: #6351e7;">Precio promoción</label>
                <input type="number" id="price" th:field="*{price}" class="form-control" min="0.01" step="0.01"
                       th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{price}"></div>
              </div>

              <div class="col-12">
                <button type="submit" class="btn text-white w-25" style="background-color: #3929b5;">Registrar</button>
                <button type="button" class="btn w-25" style="border: 1px solid #3929b5 ; color: #3929b5;">Cancelar</button>
              </div>

            </div>
          </form>
        </div>

      </div>
    </div>
  </div>
</main>

<footer>
  <div th:replace="~{fragments/footer :: siteFooter}"></div>
</footer>

<script th:src="@{/js/ts/admin-promocion.js}" defer></script>
</body>
</html>
