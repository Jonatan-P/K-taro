
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi perfil | K-TARO</title>
    <link rel="stylesheet" th:href="@{/css/inicio.css}">
    <link rel="stylesheet" th:href="@{/css/perfil.css}">
    <script th:src="@{/js/perfil.js}" defer></script>
</head>
<body>
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <div class="perfil-ruta">
        <a th:href="@{/}">Inicio</a> / Perfil
    </div>

    <main class="perfil-pagina">
        <h1>MI PERFIL</h1>

        <div class="perfil-columnas">
            <!-- Tarjeta izquierda -->
            <section class="perfil-tarjeta perfil-resumen">
                <div class="perfil-avatar" id="avatarIniciales">?</div>
                <h2 id="nombreMostrado">Mi cuenta</h2>
                <p id="correoMostrado">Completa tu información</p>

                <div class="perfil-lista">
                    <div><span>Nombres</span><strong id="resumenNombre">—</strong></div>
                    <div><span>Apellidos</span><strong id="resumenApellido">—</strong></div>
                    <div><span>DNI</span><strong id="resumenDni">—</strong></div>
                    <div><span>Teléfono</span><strong id="resumenTelefono">—</strong></div>
                    <div><span>Fecha de nac.</span><strong id="resumenFecha">—</strong></div>
                </div>
            </section>

            <!-- Columna derecha -->
            <div class="perfil-derecha">
                <section class="perfil-tarjeta pagos">
                    <div class="tarjeta-titulo">
                        <h2>Gestionar métodos de pago</h2>
                    </div>
                    <div class="pagos-contenido">
                        <p>Aún no tienes métodos de pago guardados.</p>
                    </div>
                </section>

                <section class="perfil-tarjeta configuracion">
                    <div class="tarjeta-titulo titulo-claro">
                        <h2>Configurar perfil</h2>
                        <button type="button" id="editarPerfil">Editar</button>
                    </div>

                    <form id="formPerfil">
                        <div class="campo">
                            <label for="nombre">Nombres</label>
                            <input id="nombre" type="text" required disabled>
                        </div>
                        <div class="campo">
                            <label for="apellido">Apellidos</label>
                            <input id="apellido" type="text" required disabled>
                        </div>
                        <div class="campo">
                            <label for="dni">DNI</label>
                            <input id="dni" type="text" inputmode="numeric"
                                   maxlength="8" pattern="[0-9]{8}" disabled>
                        </div>
                        <div class="campo">
                            <label for="telefono">Teléfono</label>
                            <input id="telefono" type="tel" disabled>
                        </div>
                        <div class="campo">
                            <label for="fecha">Fecha de nac.</label>
                            <input id="fecha" type="date" disabled>
                        </div>
                        <div class="campo">
                            <label for="correo">Email</label>
                            <input id="correo" type="email" required disabled>
                        </div>

                        <button type="submit" id="guardarPerfil" hidden>
                            Guardar cambios
                        </button>
                        <p id="mensajePerfil" role="status"></p>
                    </form>
                </section>
            </div>
        </div>
    </main>
     <div th:replace="~{fragments/footer :: siteFooter}"></div>
    <script th:src="@{/js/ts/inicio.js}" defer></script>
</body>

</html>
